<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>剪刀石頭布終極大對決</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; min-height: 100vh;
    font-family: system-ui, "Microsoft JhengHei", sans-serif;
    background: linear-gradient(135deg, #e8f2ff, #f7edff);
    color: #263248; display: flex; justify-content: center; align-items: center;
  }
  main {
    width: min(720px, 100%); background: #fff; border-radius: 22px;
    padding: 28px; box-shadow: 0 12px 36px #243b5320;
  }
  h1 { text-align: center; margin-top: 0; color: #4359a8; }
  .sub { text-align: center; color: #667085; margin-bottom: 24px; }
  label { display: block; font-weight: 700; margin: 14px 0 7px; }
  input, select {
    width: 100%; padding: 12px; border: 1px solid #ccd4e0;
    border-radius: 10px; font: inherit; background: white;
  }
  .equipment { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .equipment label {
    border: 1px solid #d9dfeb; padding: 12px; border-radius: 12px;
    margin: 0; font-weight: 400; cursor: pointer;
  }
  .equipment input { width: auto; margin-right: 7px; }
  .desc { display: block; font-size: .9rem; color: #667085; margin: 6px 0 0 25px; }
  button {
    border: 0; border-radius: 12px; padding: 12px 16px; font: inherit;
    font-weight: 700; cursor: pointer; background: #5367c5; color: white;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .start { width: 100%; margin-top: 18px; }
  .arena { margin-top: 22px; padding: 18px; background: #f7f8fc; border-radius: 16px; }
  .scores { display: flex; justify-content: space-around; gap: 12px; text-align: center; }
  .score { font-size: 1.8rem; font-weight: 800; color: #4359a8; }
  .choices { display: flex; gap: 10px; margin: 14px 0; }
  .choices button { flex: 1; font-size: 1.05rem; }
  #log { min-height: 80px; line-height: 1.7; white-space: pre-line; }
  .hidden { display: none; }
  .again { background: #24856c; width: 100%; margin-top: 12px; }
  @media (max-width: 520px) {
    body { padding: 12px; } main { padding: 18px; }
    .equipment { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <h1>✊✋✌️ 剪刀石頭布</h1>
  <p class="sub">先獲得 5 勝的一方就是最終贏家！</p>

  <section id="setup">
    <label for="playerName">冒險者名字</label>
    <input id="playerName" placeholder="輸入你的名字">

    <label>選擇戰鬥裝備／道具</label>
    <div class="equipment">
      <label><input type="radio" name="equipment" value="keyboard" checked>黃金鍵盤
        <span class="desc">贏得回合時，30% 機率額外 +1 勝</span></label>
      <label><input type="radio" name="equipment" value="wand">魔法魔杖
        <span class="desc">輸掉回合時，40% 機率抵銷電腦得分</span></label>
      <label><input type="radio" name="equipment" value="amulet">幸運御守
        <span class="desc">遊戲開局直接獲得 +1 勝</span></label>
      <label><input type="radio" name="equipment" value="stick">普通木棒
        <span class="desc">沒有特殊效果</span></label>
    </div>
    <button class="start" id="startBtn">開始挑戰</button>
  </section>

  <section id="game" class="arena hidden">
    <p id="welcome"></p>
    <div class="scores">
      <div>你<br><span class="score" id="playerScore">0</span> 勝</div>
      <div>電腦<br><span class="score" id="computerScore">0</span> 勝</div>
      <div>回合<br><span class="score" id="round">1</span></div>
    </div>
    <p>請選擇出拳：</p>
    <div class="choices">
      <button data-choice="剪刀">✌️ 剪刀</button>
      <button data-choice="石頭">✊ 石頭</button>
      <button data-choice="布">✋ 布</button>
    </div>
    <div id="log" aria-live="polite">準備好了就出拳！</div>
    <button id="againBtn" class="again hidden">再玩一次</button>
  </section>
</main>
<script>
const setup = document.getElementById('setup');
const game = document.getElementById('game');
const log = document.getElementById('log');
const choices = ['剪刀', '石頭', '布'];
let playerWins = 0, computerWins = 0, roundNum = 1;
let equipment = 'keyboard', playerName = '';

document.getElementById('startBtn').addEventListener('click', () => {
  playerName = document.getElementById('playerName').value.trim() || '冒險者';
  equipment = document.querySelector('input[name="equipment"]:checked').value;
  playerWins = equipment === 'amulet' ? 1 : 0;
  computerWins = 0;
  roundNum = 1;
  setup.classList.add('hidden');
  game.classList.remove('hidden');
  document.getElementById('againBtn').classList.add('hidden');
  document.getElementById('welcome').textContent =
    `歡迎勇敢的冒險者【${playerName}】！裝備：${equipmentName()}。` +
    (equipment === 'amulet' ? '幸運御守發動！開局獲得 1 勝！' : '');
  updateScore();
  log.textContent = '準備好了就出拳！';
  setChoicesEnabled(true);
  if (playerWins >= 5) finishGame();
});

function equipmentName() {
  return ({keyboard:'黃金鍵盤', wand:'魔法魔杖', amulet:'幸運御守', stick:'普通木棒'})[equipment];
}
function updateScore() {
  document.getElementById('playerScore').textContent = playerWins;
  document.getElementById('computerScore').textContent = computerWins;
  document.getElementById('round').textContent = roundNum;
}
function setChoicesEnabled(enabled) {
  document.querySelectorAll('.choices button').forEach(btn => btn.disabled = !enabled);
}
document.querySelectorAll('.choices button').forEach(button => {
  button.addEventListener('click', () => playRound(button.dataset.choice));
});
function playRound(playerChoice) {
  if (playerWins >= 5 || computerWins >= 5) return;
  const computerChoice = choices[Math.floor(Math.random() * choices.length)];
  let message = `第 ${roundNum} 回合：你出了「${playerChoice}」，電腦出了「${computerChoice}」。\\n`;
  if (playerChoice === computerChoice) {
    message += '平手！沒有人得分。';
  } else if (
    (playerChoice === '剪刀' && computerChoice === '布') ||
    (playerChoice === '石頭' && computerChoice === '剪刀') ||
    (playerChoice === '布' && computerChoice === '石頭')
  ) {
    playerWins++;
    message += '🎉 這回合你贏了！';
    if (equipment === 'keyboard' && Math.random() < 0.3) {
      playerWins++;
      message += '\\n⚡ 黃金鍵盤爆擊！額外獲得 1 勝！';
    }
  } else {
    if (equipment === 'wand' && Math.random() < 0.4) {
      message += '\\n🛡️ 魔法護盾發動！抵銷電腦本回合得分！';
    } else {
      computerWins++;
      message += '\\n💥 這回合電腦贏了！';
    }
  }
  roundNum++;
  updateScore();
  log.textContent = message;
  if (playerWins >= 5 || computerWins >= 5) finishGame();
}
function finishGame() {
  setChoicesEnabled(false);
  log.textContent += playerWins >= 5
    ? `\\n\\n🏆 恭喜 ${playerName} 以 ${playerWins} : ${computerWins} 擊敗電腦，成為剪刀石頭布大師！`
    : `\\n\\n💻 電腦以 ${computerWins} : ${playerWins} 獲得最終勝利，下次再來挑戰吧！`;
  document.getElementById('againBtn').classList.remove('hidden');
}
document.getElementById('againBtn').addEventListener('click', () => {
  game.classList.add('hidden');
  setup.classList.remove('hidden');
});
</script>
</body>
</html>
